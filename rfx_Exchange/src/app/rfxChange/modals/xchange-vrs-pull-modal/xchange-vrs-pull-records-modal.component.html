<div class="modal-container" *ngIf="isModalOpen">
  <div class="modal">
    <h2 class="modal-title">Pull Records Manually</h2>
     <button class="close-modal" (click)="closeModal()">×</button>
    <div class="pullForm" #pullInitial>
         <form (ngSubmit)="onSubmit()" #pullForm="ngForm">
      <div class="form-group">
        <label for="serviceProvider">Service Provider</label>
        <select id="serviceProvider" [(ngModel)]="formData.serviceProvider" name="serviceProvider" required>
          <option value="" disabled selected>Select Service Provider</option>
          <option *ngFor="let provider of serviceProviders" [value]="provider">{{ provider }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" name="startDate" [(ngModel)]="formData.startDate" required />
      </div>

      <div class="form-group">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate" name="endDate" [(ngModel)]="formData.endDate" required />
      </div>

      <button class="pull-btn" type="submit" [disabled]="!pullForm.form.valid">Pull Data</button>
    </form>
    </div>
    <div class="pullSuccess" #pullSuccess>
         Hi
    </div>
  </div>
</div>
